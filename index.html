<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09080c" />
  <title>Per te, amore mio</title>
  <style>
    :root{
      --ink:#f7f1e8;
      --muted:#c9c0b8;
      --gold:#d9b56f;
      --rose:#e7a4b5;
      --night:#09080c;
      --panel:rgba(14,12,17,.72);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}
    button{font:inherit}
    .app{
      min-height:100svh;
      position:relative;
      overflow:hidden;
      background:#09080c;
    }
    .screen{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:24px;
      opacity:0;
      pointer-events:none;
      transition:opacity 1.1s ease;
    }
    .screen.active{opacity:1;pointer-events:auto}
    #intro{
      background:
        radial-gradient(circle at 50% 25%, rgba(231,164,181,.15), transparent 35%),
        radial-gradient(circle at 20% 90%, rgba(255,255,255,.05), transparent 26%),
        linear-gradient(155deg,#251119,#0a080c 62%);
    }
    .intro-card{
      width:min(100%,560px);
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
      animation:rise .9s ease both;
    }
    .heart{
      width:42px;height:42px;border:1px solid rgba(255,255,255,.15);border-radius:50%;
      display:grid;place-items:center;color:var(--rose);background:rgba(255,255,255,.03);
      animation:pulse 2.8s ease-in-out infinite;
    }
    .eyebrow{margin:0;font-size:.72rem;letter-spacing:.27em;text-transform:uppercase;color:var(--muted)}
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-weight:500;
      font-size:clamp(2.1rem,9vw,4.1rem);
      line-height:1;
      letter-spacing:-.035em;
      text-wrap:balance;
    }
    h1 em{display:block;margin-top:.25em;color:var(--rose);font-weight:500}
    .sub{margin:0;color:var(--muted);line-height:1.6}
    .cta,.choice{
      appearance:none;border:0;cursor:pointer;border-radius:999px;min-height:54px;padding:0 30px;
      font-weight:700;transition:transform .18s ease,filter .18s ease,opacity .18s ease;
    }
    .cta{background:linear-gradient(135deg,#f2cad4,#df98aa);color:#241017;box-shadow:0 14px 40px rgba(223,152,170,.18)}
    .cta:active,.choice:active{transform:scale(.98)}
    .cta:focus-visible,.choice:focus-visible{outline:3px solid white;outline-offset:4px}

    #owlScene{
      background:#05060a;
      overflow:hidden;
      isolation:isolate;
    }
    .cinema{
      position:absolute;
      inset:-4%;
      transform:scale(1.04);
      transition:transform 9s cubic-bezier(.2,.7,.2,1);
    }
    #owlScene.active .cinema{transform:scale(1.13)}
    .room{
      position:absolute;inset:0;
      background:
        linear-gradient(to bottom,rgba(7,8,12,.2),rgba(4,5,8,.38)),
        radial-gradient(circle at 73% 31%,rgba(132,151,183,.20),transparent 18%),
        linear-gradient(115deg,#161821 0 29%,#0c0e15 29% 55%,#13151d 55% 100%);
    }
    .wall-lines{
      position:absolute;inset:0;
      opacity:.22;
      background:
        linear-gradient(90deg,transparent 0 47%,rgba(255,255,255,.025) 47% 48%,transparent 48%),
        repeating-linear-gradient(0deg,transparent 0 88px,rgba(255,255,255,.018) 89px 90px);
      mix-blend-mode:screen;
    }
    .window-wrap{
      position:absolute;
      width:min(47vw,430px);
      aspect-ratio:.72;
      right:7%;
      top:8%;
      border:10px solid #18151a;
      border-radius:48% 48% 8px 8px / 12% 12% 8px 8px;
      background:
        linear-gradient(90deg,transparent 48.8%,rgba(13,12,16,.9) 49% 51%,transparent 51.2%),
        linear-gradient(0deg,transparent 55%,rgba(13,12,16,.9) 55.5% 57%,transparent 57.5%),
        radial-gradient(circle at 50% 18%,rgba(178,197,224,.22),transparent 24%),
        linear-gradient(#111827,#070a11 65%);
      box-shadow:0 0 0 2px rgba(255,255,255,.03),0 0 70px rgba(89,114,155,.12);
      overflow:hidden;
    }
    .moon{
      position:absolute;right:16%;top:12%;width:54px;aspect-ratio:1;border-radius:50%;
      background:radial-gradient(circle at 36% 35%,#d8dbe0 0 38%,#8f96a0 70%,#4f5660 100%);
      box-shadow:0 0 28px rgba(196,213,236,.26);
      opacity:.82;
    }
    .rain{
      position:absolute;inset:-20%;
      opacity:.34;
      background-image:repeating-linear-gradient(113deg,transparent 0 13px,rgba(207,220,240,.42) 14px 15px,transparent 16px 32px);
      background-size:44px 44px;
      animation:rain 1.35s linear infinite;
      transform:translateZ(0);
    }
    .curtain{
      position:absolute;
      top:-2%;bottom:-2%;width:21%;
      background:linear-gradient(90deg,#171118,#2b1c26 48%,#120d13);
      filter:brightness(.8);
      box-shadow:inset -9px 0 16px rgba(0,0,0,.35);
      transform-origin:top center;
    }
    .curtain.left{left:-5%;animation:curtainL 5.3s ease-in-out infinite}
    .curtain.right{right:-5%;animation:curtainR 5.3s ease-in-out infinite}
    .desk{
      position:absolute;left:0;right:0;bottom:-7%;height:27%;
      background:
        linear-gradient(0deg,rgba(0,0,0,.28),transparent 40%),
        linear-gradient(90deg,#1b120f,#37231b 32%,#211511 80%);
      clip-path:polygon(0 24%,100% 8%,100% 100%,0 100%);
      box-shadow:0 -20px 50px rgba(0,0,0,.45);
    }
    .candle{
      position:absolute;left:17%;bottom:19%;width:11px;height:74px;background:linear-gradient(#e4d7be,#7d6f59);
      border-radius:7px 7px 2px 2px;box-shadow:0 0 14px rgba(255,203,123,.15)
    }
    .flame{
      position:absolute;left:50%;top:-17px;width:12px;height:20px;transform:translateX(-50%);
      background:radial-gradient(circle at 50% 65%,#fff6c8 0 22%,#f0a74c 45%,rgba(239,139,45,.15) 68%,transparent 72%);
      border-radius:50% 50% 46% 46%;
      animation:flicker .18s ease-in-out infinite alternate;
      filter:drop-shadow(0 0 12px rgba(255,184,87,.48));
    }
    .owl{
      position:absolute;
      width:min(30vw,250px);
      aspect-ratio:1.03;
      right:18%;
      top:31%;
      opacity:0;
      transform:translate(22vw,-20vh) rotate(-9deg) scale(.72);
      filter:drop-shadow(0 24px 24px rgba(0,0,0,.55));
      transition:none;
      z-index:4;
    }
    #owlScene.active .owl{animation:owlFly 6.1s 1.3s cubic-bezier(.2,.78,.2,1) forwards}
    .owl svg{width:100%;height:100%;display:block;overflow:visible}
    .wingL,.wingR{transform-origin:50% 54%;animation:wing .34s ease-in-out infinite alternate}
    .wingR{animation-delay:.17s}
    .letter{
      position:absolute;
      width:min(42vw,290px);
      aspect-ratio:1.45;
      right:22%;
      top:57%;
      border-radius:4px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.14),transparent 40%),
        #d8c5a2;
      box-shadow:0 15px 35px rgba(0,0,0,.5);
      transform:rotate(-6deg) scale(.65);
      opacity:0;
      z-index:5;
      border:1px solid rgba(72,48,30,.3);
    }
    .letter:before{
      content:"";
      position:absolute;inset:0;
      clip-path:polygon(0 0,100% 0,50% 58%);
      background:#e3d2b2;
      border-bottom:1px solid rgba(72,48,30,.18);
    }
    .seal{
      position:absolute;left:50%;top:56%;width:42px;aspect-ratio:1;border-radius:50%;
      transform:translate(-50%,-50%);
      background:radial-gradient(circle at 34% 30%,#b53b47,#6d1520 68%,#37090f);
      box-shadow:0 0 0 2px rgba(90,20,28,.4),0 0 18px rgba(217,181,111,.0);
      z-index:2;
    }
    #owlScene.active .letter{animation:letterArrive 1.3s 6.45s ease forwards}
    #owlScene.active .seal{animation:sealGlow 2.2s 7.4s ease-in-out infinite}
    .mist{
      position:absolute;inset:auto -15% -6% -15%;height:34%;
      background:
        radial-gradient(ellipse at 30% 60%,rgba(190,203,223,.08),transparent 48%),
        radial-gradient(ellipse at 70% 65%,rgba(190,203,223,.07),transparent 52%);
      filter:blur(12px);
      animation:mist 7s ease-in-out infinite alternate;
      pointer-events:none;
    }
    .vignette{position:absolute;inset:0;box-shadow:inset 0 0 150px 50px rgba(0,0,0,.78);pointer-events:none}
    .grain2{
      position:absolute;inset:0;opacity:.15;pointer-events:none;
      background-image:
        radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 .7px,transparent .9px),
        radial-gradient(circle at 70% 55%,rgba(255,255,255,.25) 0 .7px,transparent .9px);
      background-size:19px 19px,27px 27px;
      mix-blend-mode:soft-light;
    }
    .caption{
      position:absolute;left:50%;bottom:10%;transform:translateX(-50%) translateY(14px);
      width:min(90%,620px);text-align:center;z-index:8;opacity:0;
      text-shadow:0 2px 20px rgba(0,0,0,.8);
    }
    #owlScene.active .caption{animation:captionIn 1s 7.65s ease forwards}
    .caption p{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.2rem,4.8vw,2rem);line-height:1.25;margin:0 0 18px}
    .choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .choice{background:rgba(13,12,16,.68);color:var(--ink);border:1px solid rgba(217,181,111,.44);backdrop-filter:blur(12px);min-width:190px}
    .choice.primary{background:linear-gradient(135deg,#d8bb7b,#b88d45);color:#16100a}
    .message{
      position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:12;
      background:rgba(4,5,8,.72);backdrop-filter:blur(12px);
      opacity:0;pointer-events:none;transition:opacity .5s ease;
    }
    .message.show{opacity:1;pointer-events:auto}
    .message-card{width:min(100%,520px);text-align:center;padding:28px;border:1px solid rgba(217,181,111,.22);background:rgba(17,15,19,.82);border-radius:22px}
    .message-card h2{font-family:Georgia,"Times New Roman",serif;font-size:2rem;font-weight:500;margin:0 0 10px}
    .message-card p{color:var(--muted);line-height:1.6;margin:0 0 18px}
    .skip{
      position:absolute;right:18px;top:18px;z-index:10;
      border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.26);color:rgba(255,255,255,.72);
      border-radius:999px;padding:9px 13px;font-size:.78rem;backdrop-filter:blur(8px);cursor:pointer;
    }

    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.08);opacity:1}}
    @keyframes rain{from{background-position:0 0}to{background-position:-42px 68px}}
    @keyframes curtainL{0%,100%{transform:rotate(1.5deg) skewX(0deg)}50%{transform:rotate(-1.8deg) skewX(2deg)}}
    @keyframes curtainR{0%,100%{transform:rotate(-1.2deg) skewX(0deg)}50%{transform:rotate(1.7deg) skewX(-2deg)}}
    @keyframes flicker{from{transform:translateX(-50%) scale(.92) rotate(-2deg)}to{transform:translateX(-50%) scale(1.08) rotate(2deg)}}
    @keyframes wing{from{transform:rotate(8deg) scaleY(.92)}to{transform:rotate(-12deg) scaleY(1.06)}}
    @keyframes owlFly{
      0%{opacity:0;transform:translate(22vw,-20vh) rotate(-9deg) scale(.72)}
      12%{opacity:1}
      60%{transform:translate(3vw,-4vh) rotate(2deg) scale(.91)}
      78%{transform:translate(0,1vh) rotate(0) scale(1)}
      100%{opacity:1;transform:translate(0,2vh) rotate(0) scale(1)}
    }
    @keyframes letterArrive{
      from{opacity:0;transform:rotate(-9deg) translateY(-18px) scale(.65)}
      to{opacity:1;transform:rotate(-4deg) translateY(0) scale(1)}
    }
    @keyframes sealGlow{
      0%,100%{box-shadow:0 0 0 2px rgba(90,20,28,.4),0 0 12px rgba(217,181,111,.08)}
      50%{box-shadow:0 0 0 2px rgba(90,20,28,.4),0 0 28px rgba(217,181,111,.38)}
    }
    @keyframes mist{from{transform:translateX(-2%) scale(1)}to{transform:translateX(3%) scale(1.06)}}
    @keyframes captionIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @media (max-width:620px){
      .window-wrap{width:58vw;right:2%;top:11%}
      .owl{width:38vw;right:15%;top:33%}
      .letter{width:50vw;right:19%;top:57%}
      .desk{height:31%}
      .caption{bottom:7%}
      .choice{min-width:0;width:100%}
      .choices{width:100%}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="intro" class="screen active" aria-labelledby="introTitle">
      <div class="intro-card">
        <div class="heart" aria-hidden="true">♥</div>
        <p class="eyebrow">Per Eleonora</p>
        <h1 id="introTitle">Alla donna più bella e speciale del mondo…<em>vuoi giocare con me?</em></h1>
        <p class="sub">Ho preparato qualcosa solo per te.</p>
        <button class="cta" id="play" type="button">Giochiamo ♥</button>
      </div>
    </section>

    <section id="owlScene" class="screen" aria-label="Una notte, una lettera">
      <div class="cinema" aria-hidden="true">
        <div class="room"></div>
        <div class="wall-lines"></div>
        <div class="window-wrap">
          <div class="moon"></div>
          <div class="rain"></div>
          <div class="curtain left"></div>
          <div class="curtain right"></div>
        </div>
        <div class="desk"></div>
        <div class="candle"><div class="flame"></div></div>

        <div class="owl">
          <svg viewBox="0 0 260 250" aria-hidden="true">
            <defs>
              <radialGradient id="feather" cx="50%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#d7d0c5"/>
                <stop offset="42%" stop-color="#8a847c"/>
                <stop offset="100%" stop-color="#25252a"/>
              </radialGradient>
              <linearGradient id="wingGrad" x1="0" x2="1">
                <stop offset="0%" stop-color="#2b2d32"/>
                <stop offset="50%" stop-color="#9b958c"/>
                <stop offset="100%" stop-color="#303138"/>
              </linearGradient>
            </defs>
            <ellipse cx="130" cy="138" rx="56" ry="82" fill="url(#feather)"/>
            <g class="wingL">
              <path d="M89 105 C40 94 10 108 0 154 C32 138 55 145 80 179 C70 147 75 126 89 105Z" fill="url(#wingGrad)"/>
              <path d="M69 118 C39 119 20 130 9 153" fill="none" stroke="#c6c0b7" stroke-opacity=".35" stroke-width="3"/>
            </g>
            <g class="wingR">
              <path d="M171 105 C220 94 250 108 260 154 C228 138 205 145 180 179 C190 147 185 126 171 105Z" fill="url(#wingGrad)"/>
              <path d="M191 118 C221 119 240 130 251 153" fill="none" stroke="#c6c0b7" stroke-opacity=".35" stroke-width="3"/>
            </g>
            <circle cx="130" cy="75" r="54" fill="url(#feather)"/>
            <path d="M91 51 L109 13 L120 54Z" fill="#4b4b50"/>
            <path d="M169 51 L151 13 L140 54Z" fill="#4b4b50"/>
            <circle cx="110" cy="75" r="16" fill="#d8c773"/>
            <circle cx="150" cy="75" r="16" fill="#d8c773"/>
            <circle cx="110" cy="75" r="7" fill="#09090a"/>
            <circle cx="150" cy="75" r="7" fill="#09090a"/>
            <path d="M123 94 L137 94 L130 108Z" fill="#c99b4a"/>
            <path d="M108 116 Q130 130 152 116" fill="none" stroke="#d4cec4" stroke-opacity=".35" stroke-width="3"/>
            <path d="M115 212 L104 238 M145 212 L156 238" stroke="#bda16c" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="letter">
          <div class="seal"></div>
        </div>
        <div class="mist"></div>
        <div class="vignette"></div>
        <div class="grain2"></div>
      </div>

      <button id="skip" class="skip" type="button">Salta scena</button>

      <div class="caption">
        <p>Quella notte, qualcosa bussò alla finestra di Eleonora.</p>
        <div class="choices">
          <button class="choice primary" id="openLetter" type="button">Apri la lettera</button>
          <button class="choice" id="wait" type="button">Aspetta un istante</button>
        </div>
      </div>

      <div class="message" id="message" aria-live="polite">
        <div class="message-card">
          <h2 id="messageTitle">Per Eleonora</h2>
          <p id="messageText">Una lettera sigillata ti sta aspettando.</p>
          <button class="choice primary" id="restart" type="button">Rivedi la scena</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const owlScene = document.getElementById('owlScene');
    const play = document.getElementById('play');
    const skip = document.getElementById('skip');
    const openLetter = document.getElementById('openLetter');
    const waitBtn = document.getElementById('wait');
    const message = document.getElementById('message');
    const messageTitle = document.getElementById('messageTitle');
    const messageText = document.getElementById('messageText');
    const restart = document.getElementById('restart');

    let audioCtx = null;
    let noiseSource = null;
    let noiseGain = null;

    function startWind(){
      try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.32;
        noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        noiseSource.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 520;
        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.025;
        noiseSource.connect(filter).connect(noiseGain).connect(audioCtx.destination);
        noiseSource.start();
      }catch(e){}
    }
    function stopWind(){
      try{ if(noiseSource) noiseSource.stop(); if(audioCtx) audioCtx.close(); }catch(e){}
      noiseSource=null; audioCtx=null;
    }
    function showScene(){
      intro.classList.remove('active');
      setTimeout(()=>{
        owlScene.classList.add('active');
        startWind();
      },650);
    }
    function reveal(textTitle,textBody){
      messageTitle.textContent=textTitle;
      messageText.textContent=textBody;
      message.classList.add('show');
    }
    play.addEventListener('click',showScene);
    skip.addEventListener('click',()=>reveal('Per Eleonora','Una lettera sigillata ti sta aspettando.'));
    openLetter.addEventListener('click',()=>reveal('Cara Eleonora…','Questa non è una lettera qualunque. È l’inizio della tua storia.'));
    waitBtn.addEventListener('click',()=>reveal('Il gufo ti osserva','Sembra avere tutta l’aria di sapere qualcosa che tu ancora non sai.'));
    restart.addEventListener('click',()=>{
      message.classList.remove('show');
      stopWind();
      owlScene.classList.remove('active');
      void owlScene.offsetWidth;
      setTimeout(()=>{owlScene.classList.add('active');startWind();},80);
    });
    window.addEventListener('pagehide',stopWind);
  </script>
</body>
</html>
