<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080c"><title>Per Eleonora</title>
<style>
:root{--gold:#d9b56f;--ink:#fff8ea;--rose:#e7a4b5;--muted:#d4c9bb}
*{box-sizing:border-box}html,body{margin:0;background:#050608;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit}
.app{height:100svh;position:relative;background:#050608;overflow:hidden}.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s ease}.screen.active{opacity:1;pointer-events:auto}
#intro{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 26%,rgba(231,164,181,.16),transparent 38%),linear-gradient(155deg,#251119,#09080c 65%)}
.intro{max-width:620px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}.heart{width:42px;height:42px;border:1px solid #ffffff26;border-radius:50%;display:grid;place-items:center;color:var(--rose)}
.eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}h1{font:500 clamp(2.2rem,9vw,4.4rem)/.98 Georgia,serif;margin:0;letter-spacing:-.035em}h1 em{display:block;color:var(--rose);margin-top:.25em}.sub{color:var(--muted)}
.cta{min-height:56px;padding:0 32px;border:0;border-radius:999px;background:linear-gradient(135deg,#f2cad4,#df98aa);color:#241017;font-weight:800;box-shadow:0 14px 42px #df98aa22}
#prologue{background:#030405}.stage{position:absolute;inset:0;overflow:hidden}.shot{position:absolute;inset:-3%;opacity:0;background-image:url("assets/prologue/prologue_sprite.jpg");background-size:300% 400%;background-repeat:no-repeat;filter:saturate(.96) contrast(1.04);transform:scale(1.03);transition:opacity 1.05s ease}.shot.show{opacity:1;animation:ken 5s linear forwards}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 170px 55px #000c;pointer-events:none}.grain{position:absolute;inset:0;opacity:.1;pointer-events:none;background-image:radial-gradient(circle,#fff7 0 .55px,transparent .7px);background-size:5px 5px;mix-blend-mode:soft-light;animation:grain .25s steps(2) infinite}.bars:before,.bars:after{content:"";position:absolute;left:0;right:0;height:7.5%;background:#000;z-index:5}.bars:before{top:0}.bars:after{bottom:0}
.hud{position:absolute;inset:0;z-index:7;pointer-events:none}.skip{position:absolute;right:18px;top:calc(8% + 12px);pointer-events:auto;border:1px solid #ffffff26;background:#0007;color:#eee;border-radius:999px;padding:9px 13px;font-size:.75rem;letter-spacing:.09em}.caption{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);width:min(86%,720px);text-align:center;font:500 clamp(1.05rem,4vw,1.7rem)/1.35 Georgia,serif;text-shadow:0 3px 18px #000;opacity:0;transition:opacity .6s}.caption.show{opacity:1}.progress{position:absolute;left:5%;right:5%;bottom:8.1%;height:2px;background:#ffffff35}.progress i{display:block;height:100%;width:0;background:#f5e4b6;transition:width .35s linear}
.interaction{position:absolute;inset:0;z-index:9;display:none}.interaction.show{display:block}.hint{position:absolute;top:13%;left:50%;transform:translateX(-50%);padding:10px 14px;border:1px solid #d9b56f55;border-radius:10px;background:#08080bc7;color:#f4e6c6;font:500 .9rem Georgia,serif;backdrop-filter:blur(10px);white-space:nowrap}
.hotspot{position:absolute;border:1px solid #f3d89d99;background:#d9b56f12;border-radius:50%;width:88px;height:88px;box-shadow:0 0 0 0 #d9b56f66;animation:pulseRing 1.7s ease-out infinite}.hotspot.star{left:35%;top:43%}.hotspot.rabbit{right:24%;top:48%}.hotspot span{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;color:#f8e8c9;font-size:.82rem;text-shadow:0 2px 8px #000}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff7d6 0,#d9b56f55 16%,transparent 44%);opacity:0;pointer-events:none;z-index:11}.flash.on{animation:flash .9s ease}
.traits{position:absolute;inset:0;z-index:12;display:none;place-items:center;padding:24px;background:#050608dc;backdrop-filter:blur(12px)}.traits.show{display:grid}.traitbox{width:min(100%,760px);text-align:center}.traitbox h2{font:500 clamp(1.55rem,6vw,2.4rem)/1.1 Georgia,serif;color:#f3d89d;margin:0 0 22px}.traitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.trait{min-height:170px;border:1px solid #d9b56f55;background:linear-gradient(180deg,#1b1714e8,#0b0a0be8);color:#f7ecd8;border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px}.trait b{font:600 1.05rem Georgia,serif}.trait small{color:#c9bda9;line-height:1.35}.orb{font-size:2rem}
.end{position:absolute;inset:0;z-index:14;display:none;place-items:end center;padding:0 24px 12%;text-align:center;background:linear-gradient(transparent 20%,#050608dc)}.end.show{display:grid}.end h2{font:500 clamp(1.8rem,7vw,3rem) Georgia,serif;margin:0 0 8px;color:#f3d89d}.end p{color:#ddd0bd;margin:0 0 18px}.ghost{border:1px solid #d9b56f66;background:#11100dcc;color:#f3e8d0;border-radius:999px;padding:13px 22px}
@keyframes ken{from{transform:scale(1.03)}to{transform:scale(1.11) translate3d(-.8%,-.4%,0)}}@keyframes grain{0%{transform:translate(0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}@keyframes pulseRing{0%{box-shadow:0 0 0 0 #d9b56f66}70%{box-shadow:0 0 0 18px #d9b56f00}100%{box-shadow:0 0 0 0 #d9b56f00}}@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@media(max-width:640px){.traitgrid{grid-template-columns:1fr}.trait{min-height:112px}.hotspot{width:72px;height:72px}.hotspot.star{left:28%;top:42%}.hotspot.rabbit{right:16%;top:48%}.shot{inset:-10%;background-position:center}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="app">
<section id="intro" class="screen active"><div class="intro"><div class="heart">♥</div><div class="eyebrow">Per Eleonora</div><h1>Alla donna più bella e speciale del mondo…<em>vuoi giocare con me?</em></h1><p class="sub">Ho preparato qualcosa solo per te.</p><button id="play" class="cta" type="button">Giochiamo ♥</button></div></section>
<section id="prologue" class="screen" aria-label="Prologo: la nascita di Eleonora"><div class="stage"><div id="shotA" class="shot"></div><div id="shotB" class="shot"></div><div class="vignette"></div><div class="grain"></div><div class="bars"></div></div><div class="hud"><button id="skip" class="skip" type="button">SALTA »</button><div id="caption" class="caption"></div><div class="progress"><i id="bar"></i></div></div>
<div id="interaction" class="interaction"><div class="hint">✦ Tocca un oggetto per interagire</div><button class="hotspot star" data-object="stella" aria-label="Tocca la stella"><span>Tocca la stella</span></button><button class="hotspot rabbit" data-object="coniglietto" aria-label="Tocca il coniglietto"><span>Tocca il coniglietto</span></button></div><div id="flash" class="flash"></div>
<div id="traits" class="traits"><div class="traitbox"><h2>Quale luce senti più vicina a lei?</h2><div class="traitgrid"><button class="trait" data-trait="curiosita"><span class="orb">✦</span><b>Curiosità</b><small>Scopre il mondo con meraviglia.</small></button><button class="trait" data-trait="dolcezza"><span class="orb">☾</span><b>Dolcezza</b><small>Vede la bellezza nelle piccole cose.</small></button><button class="trait" data-trait="determinazione"><span class="orb">✺</span><b>Determinazione</b><small>Seguirà sempre la sua strada.</small></button></div></div></div>
<div id="end" class="end"><div><h2>I primi segni della magia…</h2><p>La storia di Eleonora è appena cominciata.</p><button id="replay" class="ghost" type="button">Rivedi il prologo</button></div></div></section></main>
<script>
const POSITIONS={
  title:"0% 0%",city:"50% 0%",window:"100% 0%",
  nursery:"0% 33.333%",baby:"50% 33.333%",interact:"100% 33.333%",
  sparkles:"0% 66.666%",hand:"50% 66.666%",baby2:"100% 66.666%",
  name:"0% 100%",traits:"50% 100%",child:"100% 100%"
};
const intro=document.getElementById('intro'),pro=document.getElementById('prologue'),play=document.getElementById('play'),skip=document.getElementById('skip'),cap=document.getElementById('caption'),bar=document.getElementById('bar'),a=document.getElementById('shotA'),b=document.getElementById('shotB'),inter=document.getElementById('interaction'),flash=document.getElementById('flash'),traits=document.getElementById('traits'),end=document.getElementById('end'),replay=document.getElementById('replay');
let active=a,timers=[],audio=null;
const frames={title:['title','4 Ottobre 1996\nIn una notte d’autunno, ebbe inizio una storia speciale.'],city:['city','Una città addormentata. Ma quella notte, qualcosa cambiò.'],window:['window','Dietro quella finestra, si scriveva già un destino.'],nursery:['nursery','Alcune anime nascono nel silenzio. Altre arrivano al mondo con un po’ di magia nel destino.'],baby:['baby','Quella notte nacque Eleonora.'],interact:['interact',''],sparkles:['sparkles','Un piccolo segno… come se il mondo l’avesse già riconosciuta.'],hand:['hand','E con lei, una luce gentile che il mondo non aveva ancora conosciuto.'],name:['name','ELEONORA — La sua storia comincia qui.'],child:['child','I primi segni della magia…']};
function preload(){const i=new Image();i.src="assets/prologue/prologue_sprite.jpg"}preload();
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t)}function clearAll(){timers.forEach(clearTimeout);timers=[]}
function showFrame(key){const [imgKey,text]=frames[key];const next=active===a?b:a;next.style.backgroundPosition=POSITIONS[imgKey]||"0% 0%";next.className='shot';void next.offsetWidth;next.classList.add('show');active.classList.remove('show');active=next;cap.textContent=text;cap.classList.toggle('show',!!text)}
function ambience(){try{audio=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sine';o.frequency.value=68;g.gain.value=.018;f.type='lowpass';f.frequency.value=160;o.connect(f).connect(g).connect(audio.destination);o.start()}catch(e){}}
function stopAudio(){try{audio&&audio.close()}catch(e){}audio=null}
function start(){clearAll();inter.classList.remove('show');traits.classList.remove('show');end.classList.remove('show');intro.classList.remove('active');pro.classList.add('active');ambience();bar.style.width='0%';showFrame('title');later(()=>bar.style.width='20%',400);later(()=>showFrame('city'),3200);later(()=>bar.style.width='40%',3600);later(()=>showFrame('window'),7000);later(()=>bar.style.width='60%',7400);later(()=>showFrame('nursery'),10800);later(()=>bar.style.width='80%',11200);later(()=>showFrame('baby'),14600);later(()=>{bar.style.width='100%';showFrame('interact');cap.classList.remove('show');inter.classList.add('show')},18400)}
function jumpToInteraction(){clearAll();bar.style.width='100%';showFrame('interact');cap.classList.remove('show');inter.classList.add('show')}
function continueAfterChoice(obj){localStorage.setItem('amoremio.birthObject',obj);inter.classList.remove('show');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');showFrame('sparkles');bar.style.width='0%';later(()=>bar.style.width='35%',250);later(()=>showFrame('hand'),3000);later(()=>bar.style.width='70%',3250);later(()=>showFrame('name'),6100);later(()=>bar.style.width='100%',6350);later(()=>{traits.classList.add('show');cap.classList.remove('show')},9500)}
document.querySelectorAll('.hotspot').forEach(x=>x.addEventListener('click',()=>continueAfterChoice(x.dataset.object)));
document.querySelectorAll('.trait').forEach(x=>x.addEventListener('click',()=>{localStorage.setItem('amoremio.firstTrait',x.dataset.trait);traits.classList.remove('show');showFrame('child');later(()=>end.classList.add('show'),3200)}));
play.addEventListener('click',start);skip.addEventListener('click',jumpToInteraction);replay.addEventListener('click',()=>{stopAudio();start()});window.addEventListener('pagehide',stopAudio);
</script></body></html>
