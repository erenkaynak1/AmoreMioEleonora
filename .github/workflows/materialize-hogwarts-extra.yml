name: Materialize Hogwarts extra HQ
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-hogwarts-extra.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download HQ chapter assets
        run: |
          set -e
          mkdir -p assets/hogwarts
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631610976/render.png?token=exp=1791331200~hmac=ee042b2f8ef21d38ca1e8ed58cf4871c920b7ece56566cb71b836e7fb6444151" -o assets/hogwarts/spell-class-hq.png
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631611343/render.png?token=exp=1791331200~hmac=92ac153e3befe9d9b0386a7857b7d66652125b408888185751ba6195447adbce" -o assets/hogwarts/library-hq.png
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631611499/render.png?token=exp=1791331200~hmac=a37b61eb73242de2b635c5ed4814e8cefa1d793925972383b01878ba96074e76" -o assets/hogwarts/stairs-hq.png
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hogwarts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add HQ Hogwarts gameplay backgrounds"
          git push
