name: Materialize HQ journey assets
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-journey-hq.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download HQ journey assets
        run: |
          set -e
          mkdir -p assets/journey
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631537256/3680466149.png?token=exp=1791331200~hmac=5dcdb9584d2f9b7e7b8b12c9ac91cce4038f272a6f8d3b0365d4121d7734e4d3" -o assets/journey/diagon-hq.png
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631537534/3680466274.png?token=exp=1791331200~hmac=4feba7cf7b02068f33358213c655e56a34eeb423244a3ebdaf726d7573c5316a" -o assets/journey/station-hq.png
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631537965/3680466473.png?token=exp=1791331200~hmac=565ace1cbf40c9effff34da34a4b80ac9a34c288b0a09fbdf8a6c2615434613c" -o assets/journey/platform-hq.png
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631538350/3680466650.png?token=exp=1791331200~hmac=05d195ae8070d928fdf7f7a6d5b776e6ec1c3c8c06d2a1f8dc7862b5e5a3687b" -o assets/journey/train-hq.png
          curl -L --fail "https://pikaso.cdnpk.net/private/production/5631538837/3680466895.png?token=exp=1791331200~hmac=9fa3e6dd434afbb7b83fce44278a28243a103b6f7552750199f3d23962d58f66" -o assets/journey/castle-hq.png
      - name: Commit HQ assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/journey
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add HQ journey artwork"
          git push
