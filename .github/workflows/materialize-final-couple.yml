name: Materialize final couple artwork
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-final-couple.yml"
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download final artwork
        env:
          SOURCE_B64: aHR0cHM6Ly9waWthc28uY2RucGsubmV0L3ByaXZhdGUvcHJvZHVjdGlvbi81NjMyMDM3NDE1LzM2ODA3MTM0MjQucG5nP3Rva2VuPWV4cD0xNzkxMzMxMjAwfmhtYWM9ZjQ3MjY4YzkzODBkNDdjMmNjN2VmOGE0ODQxMmNmNTY5NWIxNjIwYTRlYmVkM2UxMTk1MmVmMjNlZGQ1NGQ4ZQ==
        run: |
          set -e
          mkdir -p assets/finale
          URL="$(printf '%s' "$SOURCE_B64" | base64 -d)"
          curl -L --fail "$URL" -o assets/finale/eren-eleonora-magic.png
          rm -f assets/finale/eren-eleonora-magic.webp
          test "$(wc -c < assets/finale/eren-eleonora-magic.png)" -gt 100000
      - name: Commit final artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/finale
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix final Eren and Eleonora artwork"
          git push
